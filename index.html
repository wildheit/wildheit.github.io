<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-ja="Nuko Apps" data-en="Nuko Apps">Nuko Apps</title>
<meta name="description" data-ja="個人開発者が作る、広告なしのシンプルなAndroidアプリ一覧。" data-en="A list of simple, ad-free Android apps by an independent developer." content="個人開発者が作る、広告なしのシンプルなAndroidアプリ一覧。">
<link rel="icon" href="nukoclip/assets/icon.png">
<script src="assets/i18n.js" defer></script>
<style>
  :root {
    --violet-deep: #3B2F54;
    --violet-soft: #4B3B6B;
    --coral: #FF705F;
    --cream: #F8E9D4;
    --ink: #222222;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.7;
  }
  a { color: var(--violet-soft); }
  img { max-width: 100%; display: block; }

  .hero {
    position: relative;
    background: linear-gradient(135deg, var(--violet-deep) 0%, var(--violet-deep) 60%, var(--coral) 130%);
    color: var(--cream);
    padding: 64px 24px 56px;
    text-align: center;
  }
  .hero h1 { font-size: 40px; margin: 0 0 8px; }
  .hero p { font-size: 17px; opacity: 0.9; max-width: 46ch; margin: 0 auto; }

  .lang-toggle {
    position: absolute;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 6px;
  }
  .lang-toggle button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.35);
    color: var(--cream);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .lang-toggle button.active { background: var(--cream); color: var(--violet-deep); font-weight: bold; border-color: var(--cream); }

  main { max-width: 720px; margin: 0 auto; padding: 48px 24px 24px; }

  .app-list { display: flex; flex-direction: column; gap: 20px; }
  .app-card {
    display: flex;
    align-items: center;
    gap: 18px;
    background: white;
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .app-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .app-card img {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .app-card .app-name { font-size: 18px; font-weight: bold; color: var(--violet-deep); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .app-card .app-desc { font-size: 14px; color: #555; margin: 0; }
  .tag {
    font-size: 11px;
    font-weight: normal;
    color: #8a6d1f;
    background: #F6E4C9;
    border-radius: 999px;
    padding: 2px 10px;
  }

  .more-note {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: 36px;
  }

  footer {
    background: var(--violet-deep);
    color: rgba(248,233,212,0.7);
    padding: 32px 24px;
    text-align: center;
    font-size: 13px;
    margin-top: 48px;
  }
  footer a { color: var(--cream); }
</style>
</head>
<body>

<div class="hero">
  <div class="lang-toggle">
    <button type="button" data-lang-btn="ja">日本語</button>
    <button type="button" data-lang-btn="en">EN</button>
  </div>
  <h1>Nuko Apps</h1>
  <p data-ja="個人開発者として、「あったら便利」と思えるシンプルなアプリを一つひとつ丁寧に作っています。広告なしのアプリを中心に展開中です。" data-en="As an independent developer, I carefully build simple apps that are genuinely useful, one at a time. Most of them are ad-free.">個人開発者として、「あったら便利」と思えるシンプルなアプリを一つひとつ丁寧に作っています。広告なしのアプリを中心に展開中です。</p>
</div>

<main>
  <div class="app-list">
    <a class="app-card" href="nukoclip/">
      <img src="nukoclip/assets/icon.png" alt="NukoClip icon">
      <div>
        <p class="app-name">NukoClip</p>
        <p class="app-desc" data-ja="描くを、もっとシンプルに。レイヤー機能充実のお絵描きアプリ。" data-en="Drawing made simple. A layer-rich illustration app.">描くを、もっとシンプルに。レイヤー機能充実のお絵描きアプリ。</p>
      </div>
    </a>
    <a class="app-card" href="nukostash/">
      <img src="nukostash/assets/icon.svg" alt="Stash icon">
      <div>
        <p class="app-name">Stash</p>
        <p class="app-desc" data-ja="写真や動画を簡単に貯められるタイムラインビューワーアプリ。" data-en="A timeline viewer that makes it easy to save photos and videos.">写真や動画を簡単に貯められるタイムラインビューワーアプリ。</p>
      </div>
    </a>
  </div>

  <p class="more-note" data-ja="他にもいくつかアプリを開発中です。公開まで少々お待ちください。" data-en="A few more apps are in the works. Stay tuned.">他にもいくつかアプリを開発中です。公開まで少々お待ちください。</p>
</main>

<footer>
  <p data-ja="Nuko Apps — 個人開発" data-en="Nuko Apps — built by an independent developer">Nuko Apps — 個人開発</p>
  <p><a href="mailto:nu0417ko@gmail.com" data-ja="お問い合わせ" data-en="Contact">お問い合わせ</a></p>
</footer>

</body>
</html>
